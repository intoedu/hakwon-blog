<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>블로그 홍보 진행현황 · ESC 학원지원센터</title>
<link rel="stylesheet" href="app.css">
<style>
  body{background:var(--ground)}
  .pg{max-width:900px;margin:0 auto;padding:0 18px 70px}
  .pgtop{border-bottom:1px solid var(--line);background:var(--surface)}
  .pgtop .in{max-width:900px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:10px}
  .pgtop .mk{width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--on-brand);
             display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .pgtop b{display:block;font-size:14.5px}
  .pgtop span{display:block;color:var(--muted);font-size:11.5px}
  .pgtop .btn{margin-left:auto}

  .hero{padding:30px 0 4px}
  .hero h1{font-size:26px;font-weight:750}
  .hero p{color:var(--muted);font-size:13.5px;margin-top:6px}

  .big{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px}
  .big .n{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .big .n b{font-size:40px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
  .big .n em{font-style:normal;font-size:15px;color:var(--muted)}
  .big .bar{height:10px;margin:14px 0 10px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

  .ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
         padding:16px 18px;margin-top:12px}
  .ocard .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .ocard .h b{font-size:15px}
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kv > div label{display:block;color:var(--muted);font-size:11.5px;font-weight:700;margin-bottom:2px}
  .kv > div span{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}

  .rk{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rk.top{color:var(--ok)} .rk.mid{color:var(--wait)} .rk.low{color:var(--muted);font-weight:600}

  .note{margin-top:26px;background:var(--surface-2);border:1px solid var(--line);
        border-radius:var(--radius);padding:16px 18px;color:var(--ink-2);font-size:13.5px;line-height:1.75}
  .note b{color:var(--ink)}
  .pgfoot{margin-top:30px;color:var(--muted);font-size:12px;text-align:center;line-height:1.8}

  @media (max-width:700px){
    .hero h1{font-size:21px}
    .big .n b{font-size:32px}
    .kv{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<div class="pgtop"><div class="in">
  <div class="mk">ESC</div>
  <div><b>블로그 홍보 진행현황</b><span>학원지원센터</span></div>
  <button class="btn btn-s" id="btnRe">새로고침</button>
</div></div>

<div class="pg" id="pg">
  <div class="empty" style="margin-top:60px">불러오는 중입니다…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  'use strict';
  var SB_URL = 'https://qkvebwxewttqtcryfycy.supabase.co';
  var SB_KEY = 'sb_publishable_Me_R6M540Fg60nmEVqByTg_p-zD8pxa';

  function esc(s) {
    return (s == null ? '' : ('' + s))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function won(n) { return (Number(n) || 0).toLocaleString('ko-KR'); }
  function fdate(s) {
    if (!s) return '-';
    var d = new Date(s);
    return d.getFullYear() + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + ('0' + d.getDate()).slice(-2);
  }
  function dday(d) {
    if (!d) return null;
    var t = new Date().toISOString().slice(0, 10);
    return Math.round((new Date(d + 'T00:00:00') - new Date(t + 'T00:00:00')) / 86400000);
  }
  /* 열어도 되는 주소만 링크로 겁니다 */
  function safeUrl(u) {
    if (!u) return '';
    return /^https?:\/\//i.test(u) ? u : '';
  }
  var PG = document.getElementById('pg');
  function fail(msg) {
    PG.innerHTML = '<div class="big" style="margin-top:48px;text-align:center">'
      + '<h1 style="font-size:19px;margin-bottom:8px">' + esc(msg) + '</h1>'
      + '<p style="color:var(--muted);font-size:13.5px">주소를 다시 확인해 주시고, 그래도 안 열리면 '
      + '담당자에게 말씀해 주세요.<br>ESC 학원지원센터 · 010-7318-1790</p></div>';
  }

  function key() {
    var m = location.search.match(/[?&]k=([^&#]+)/);
    if (m) return decodeURIComponent(m[1]);
    var h = location.hash.match(/k=([^&]+)/);
    return h ? decodeURIComponent(h[1]) : '';
  }

  /* 검색 순위 표시 */
  function rank(n) {
    if (n == null) return '<span class="rk low">확인 중</span>';
    var c = n <= 5 ? 'top' : n <= 20 ? 'mid' : 'low';
    return '<span class="rk ' + c + '">' + n + '위</span>';
  }

  function render(d) {
    var orders = d.orders || [], posts = d.posts || [];
    var T = { qty: 0, made: 0, writing: 0, review: 0, published: 0, checked: 0 };
    orders.forEach(function (o) {
      T.qty += o.qty || 0; T.made += o.made || 0; T.writing += o.writing || 0;
      T.review += o.review || 0; T.published += o.published || 0; T.checked += o.checked || 0;
    });
    var pct = T.qty ? Math.round(T.published / T.qty * 100) : 0;
    var working = T.writing + T.review;
    var waiting = Math.max(0, T.qty - T.published - working);
    var unpaid = orders.filter(function (o) { return !o.paid; }).length;

    var h = '';

    h += '<div class="hero"><h1>' + esc(d.academy) + '</h1>'
      + '<p>지금까지 올라간 글과 네이버 검색 순위입니다. 새로 올라갈 때마다 이 화면이 바뀝니다.</p></div>';

    h += '<div class="big">'
      + '<div class="n"><b>' + T.published + '</b><em>/ ' + T.qty + '편 올라갔습니다</em>'
      + '<span class="chip ' + (pct >= 100 ? 'c-ok' : 'c-info') + '" style="margin-left:auto">'
      + pct + '%</span></div>'
      + '<div class="bar' + (pct >= 100 ? '' : ' mid') + '"><i style="width:' + Math.min(100, pct) + '%"></i></div>'
      + '<div class="legend">'
      + '<span><i style="background:var(--ok)"></i>올라간 글 ' + T.published + '편</span>'
      + '<span><i style="background:var(--info)"></i>쓰는 중 ' + working + '편</span>'
      + '<span><i style="background:var(--line)"></i>준비 중 ' + waiting + '편</span>'
      + '</div></div>';

    if (unpaid) {
      h += '<div class="msg ok" style="margin-top:12px">입금이 확인되면 글 작성이 시작됩니다. '
        + '입금 확인이 안 된 주문이 ' + unpaid + '건 있습니다.</div>';
    }

    /* 주문 */
    h += '<div class="sec">주문 <small>' + orders.length + '건</small></div>';
    h += orders.map(function (o) {
      var dd = dday(o.deadline);
      var st = o.status === 'done' ? '<span class="chip c-ok">다 끝냈습니다</span>'
        : o.status === 'paused' ? '<span class="chip c-wait">잠시 멈춤</span>'
          : o.status === 'ended' ? '<span class="chip c-off">종료</span>'
            : '<span class="chip c-info">진행 중</span>';
      var ddChip = dd == null ? ''
        : dd < 0 ? '<span class="chip c-bad">마감일 지남</span>'
          : dd === 0 ? '<span class="chip c-bad">오늘이 마감일</span>'
            : dd <= 7 ? '<span class="chip c-wait">' + dd + '일 남음</span>'
              : '<span class="chip c-off">' + dd + '일 남음</span>';
      return '<div class="ocard">'
        + '<div class="h"><b>' + fdate(o.ordered_at) + ' 주문 · ' + o.qty + '편</b>' + st + ddChip
        + (o.paid ? '<span class="chip c-ok" style="margin-left:auto">입금 확인됨</span>'
          : '<span class="chip c-wait" style="margin-left:auto">입금 기다리는 중</span>') + '</div>'
        + '<div class="kv">'
        + '<div><label>주문 편수</label><span>' + o.qty + '편</span></div>'
        + '<div><label>올라간 글</label><span>' + o.published + '편</span></div>'
        + '<div><label>마감일</label><span>' + (o.deadline ? fdate(o.deadline) : '-') + '</span></div>'
        + '<div><label>금액</label><span>' + (o.amount ? won(o.amount) + '원' : '-') + '</span></div>'
        + '</div></div>';
    }).join('');

    /* 사진 보내기 */
    h += '<div class="sec">사진 보내기 <small>지금까지 ' + (d.photos || 0) + '장 받았습니다</small></div>'
      + '<div class="ocard">'
      + '<p style="font-size:13.5px;color:var(--ink-2);line-height:1.7;margin-bottom:12px">'
      + '<b>신청하실 때 못 보내셨어도 괜찮습니다. 언제든 여기서 올리시면 됩니다.</b><br>'
      + '사진이 많을수록 좋습니다. 글마다 다른 사진을 써야 검색에 잘 걸리기 때문입니다 — '
      + '<b>30장 이상을 권합니다.</b><br>'
      + '간판·건물 바깥, 강의실, 교재, 시간표, 안내문, 수업 자료 등 '
      + '<b>학생 얼굴이 나오지 않는 사진</b>이면 무엇이든 좋습니다.</p>'
      + '<input type="file" id="upFiles" accept="image/*" multiple '
      + 'style="width:100%;font-size:13px;margin-bottom:10px">'
      + '<input class="inp" id="upNote" placeholder="같이 알려주실 내용이 있으면 적어주세요 (안 쓰셔도 됩니다)" '
      + 'style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;'
      + 'background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px">'
      + '<div class="row" style="margin-top:12px">'
      + '<button class="btn btn-p" id="upGo">사진 올리기</button>'
      + '<span class="mono" id="upMsg">한 장에 10MB까지 · 한 번에 60장까지</span></div>'
      + '</div>';

    /* 올라간 글 */
    h += '<div class="sec">올라간 글 <small>' + posts.length + '편 · 새 창에서 열립니다</small></div>';
    if (!posts.length) {
      h += '<div class="tblbox">' + '<div class="empty">아직 올라간 글이 없습니다. '
        + '글이 올라가는 대로 여기에 하나씩 쌓입니다.</div></div>';
    } else {
      h += '<div class="tblbox tblscroll"><table><thead><tr>'
        + '<th style="width:36px">#</th><th>이 글이 노린 검색어</th><th style="width:90px">올린 날</th>'
        + '<th style="width:80px">검색 순위</th><th style="width:150px"></th>'
        + '</tr></thead><tbody>'
        + posts.map(function (p, i) {
          var u = safeUrl(p.url);
          var kw = p.keyword || '';
          return '<tr><td class="mono">' + (i + 1) + '</td>'
            + '<td><b>' + esc(kw) + '</b></td>'
            + '<td class="mono">' + fdate(p.at) + '</td>'
            + '<td>' + rank(p.rank) + '</td>'
            + '<td style="white-space:nowrap">'
            + (u ? '<a class="btn btn-s" href="' + esc(u) + '" target="_blank" rel="noopener nofollow">글 보기 ↗</a> ' : '')
            + (kw ? '<a class="btn btn-s" target="_blank" rel="noopener nofollow" href="https://search.naver.com/search.naver?query='
              + encodeURIComponent(kw) + '">검색 ↗</a>' : '')
            + '</td></tr>';
        }).join('')
        + '</tbody></table></div>';
    }

    h += '<div class="note"><b>검색 순위는 어떻게 나온 건가요?</b><br>'
      + '왼쪽에 적힌 검색어를 네이버에 그대로 넣었을 때, 그 글이 블로그 영역에서 몇 번째로 나왔는지를 '
      + '저희가 직접 확인해 적은 숫자입니다. 옆의 <b>검색 ↗</b> 버튼을 누르시면 직접 확인해 보실 수 있습니다.<br>'
      + '검색 순위는 시간이 지나면서 오르내립니다. 글이 쌓일수록 학원 이름이 걸리는 검색어가 늘어납니다.<br><br>'
      + '<b>글은 누가 쓰나요?</b><br>'
      + '저희와 함께하는 블로거들이 각자의 블로그에 학원을 소개하는 글을 올립니다. '
      + '올라간 글은 최소 12개월 동안 지우지 않습니다.</div>';

    h += '<div class="pgfoot">ESC 학원지원센터 · 010-7318-1790 · benjamin.leeeunchong08@gmail.com<br>'
      + '이 주소는 학원별로 다릅니다. 다른 학원의 내용은 보이지 않습니다.<br>'
      + '<span class="mono">' + fdate(d.now) + ' 기준</span></div>';

    PG.innerHTML = h;
    wireUpload();
  }

  /* ── 사진 올리기 ── */
  var SB = null;
  function sb() {
    if (!SB) SB = window.supabase.createClient(SB_URL, SB_KEY);
    return SB;
  }
  function wireUpload() {
    var btn = document.getElementById('upGo'); if (!btn) return;
    btn.onclick = async function () {
      var inp = document.getElementById('upFiles');
      var msg = document.getElementById('upMsg');
      var files = inp.files ? Array.prototype.slice.call(inp.files) : [];
      if (!files.length) { msg.textContent = '올릴 사진을 먼저 골라 주세요.'; return; }
      if (files.length > 60) { msg.textContent = '한 번에 60장까지만 올릴 수 있습니다.'; return; }
      var big = files.filter(function (f) { return f.size > 10 * 1024 * 1024; });
      if (big.length) { msg.textContent = '10MB가 넘는 사진이 있습니다: ' + big[0].name; return; }

      btn.disabled = true; inp.disabled = true;
      var folder = 'k-' + key();
      var stamp = String(Date.now());
      var paths = [];
      try {
        for (var i = 0; i < files.length; i++) {
          var f = files[i];
          var ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
          var path = folder + '/' + stamp + '-' + ('00' + (i + 1)).slice(-3) + '.' + ext;
          msg.textContent = files.length + '장 중 ' + (i + 1) + '장째 올리는 중…';
          var up = await sb().storage.from('request-photos')
            .upload(path, f, { contentType: f.type || 'image/jpeg', upsert: false });
          if (up.error) throw new Error(up.error.message);
          paths.push(up.data.path);
        }
        var note = (document.getElementById('upNote').value || '').trim();
        var r = await sb().rpc('order_add_photos', { k: key(), p_paths: paths, p_note: note || null });
        if (r.error) throw new Error(r.error.message);
        msg.textContent = '';
        alert(paths.length + '장을 보내주셨습니다. 담당자가 확인하고 글에 씁니다. 감사합니다!');
        load();
      } catch (e) {
        msg.textContent = '올리지 못했습니다: ' + e.message + ' — 다시 시도해 주시거나 010-7318-1790 으로 연락 주세요.';
        btn.disabled = false; inp.disabled = false;
      }
    };
  }

  async function load() {
    var k = key();
    if (!k) { fail('주소에 확인 코드가 없습니다'); return; }
    if (!window.supabase || !window.supabase.createClient) { fail('연결에 실패했습니다'); return; }
    var r = await sb().rpc('order_status', { k: k });
    if (r.error) { fail('불러오지 못했습니다'); console.warn(r.error.message); return; }
    if (!r.data) { fail('이 주소로는 볼 수 있는 내용이 없습니다'); return; }
    render(r.data);
  }

  document.getElementById('btnRe').onclick = function () { PG.innerHTML = '<div class="empty" style="margin-top:60px">불러오는 중입니다…</div>'; load(); };
  load();
})();
</script>
</body>
</html>
