<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>블로그 홍보 진행현황 · ESC 학원지원센터</title>
<link rel="stylesheet" href="app.css">
<style>
  body{background:var(--ground)}
  .pg{max-width:900px;margin:0 auto;padding:0 18px 70px}
  .pgtop{border-bottom:1px solid var(--line);background:var(--surface)}
  .pgtop .in{max-width:900px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:10px}
  .pgtop .mk{width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--on-brand);
             display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .pgtop b{display:block;font-size:14.5px}
  .pgtop span{display:block;color:var(--muted);font-size:11.5px}
  .pgtop .btn{margin-left:auto}

  .hero{padding:30px 0 4px}
  .hero h1{font-size:26px;font-weight:750}
  .hero p{color:var(--muted);font-size:13.5px;margin-top:6px}

  .big{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px}
  .big .n{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .big .n b{font-size:40px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
  .big .n em{font-style:normal;font-size:15px;color:var(--muted)}
  .big .bar{height:10px;margin:14px 0 10px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

  .ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
         padding:16px 18px;margin-top:12px}
  .ocard .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .ocard .h b{font-size:15px}
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kv > div label{display:block;color:var(--muted);font-size:11.5px;font-weight:700;margin-bottom:2px}
  .kv > div span{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}

  .rk{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hide{display:none !important}
  .picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;margin-top:14px}
  .picitem{position:relative;display:block;aspect-ratio:1;border:1px solid var(--line);
           border-radius:9px;overflow:hidden;background:var(--surface-2)}
  .picitem img{width:100%;height:100%;object-fit:cover;display:block}
  .picitem span{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.6);color:#fff;
           font-size:10.5px;padding:1px 6px;border-radius:20px}
  .noteitem{border-top:1px solid var(--line);padding:13px 0}
  .noteitem:first-child{border-top:0;padding-top:0}
  .notebody{white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
  .rk.top{color:var(--ok)} .rk.mid{color:var(--wait)} .rk.low{color:var(--muted);font-weight:600}

  .note{margin-top:26px;background:var(--surface-2);border:1px solid var(--line);
        border-radius:var(--radius);padding:16px 18px;color:var(--ink-2);font-size:13.5px;line-height:1.75}
  .note b{color:var(--ink)}
  .pgfoot{margin-top:30px;color:var(--muted);font-size:12px;text-align:center;line-height:1.8}

  @media (max-width:700px){
    .hero h1{font-size:21px}
    .big .n b{font-size:32px}
    .kv{grid-template-columns:repeat(2,1fr)}
  }
</style>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12294D">
</head>
<body>

<div class="pgtop"><div class="in">
  <div class="mk">ESC</div>
  <div><b>블로그 홍보 진행현황</b><span>학원지원센터</span></div>
  <button class="btn btn-s" id="btnRe">새로고침</button>
</div></div>

<div class="pg" id="pg">
  <div class="empty" style="margin-top:60px">불러오는 중입니다…</div>
</div>

<script>
(function () {
  'use strict';
  var SB_URL = 'https://qkvebwxewttqtcryfycy.supabase.co';
  var SB_KEY = 'sb_publishable_Me_R6M540Fg60nmEVqByTg_p-zD8pxa';

  /* 학원에 보내는 유일한 주소라 가장 튼튼해야 합니다.
     바깥 라이브러리(CDN)를 하나도 안 쓰고 브라우저 기본 기능만으로 주고받습니다.
     — 광고차단기·회사망·메신저 인앱 브라우저에서 CDN이 막혀도 열립니다. */
  function hdr(extra) {
    var h = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };
    for (var k in extra) h[k] = extra[k];
    return h;
  }
  async function rpc(fn, body) {
    var r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST', headers: hdr({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body)
    });
    var txt = await r.text();
    var data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
    if (!r.ok) throw new Error((data && data.message) || txt.slice(0, 150) || ('오류 ' + r.status));
    return data;
  }
  async function putPhoto(path, file) {
    var r = await fetch(SB_URL + '/storage/v1/object/request-photos/' + encodeURI(path), {
      method: 'POST',
      headers: hdr({ 'Content-Type': file.type || 'image/jpeg', 'x-upsert': 'false' }),
      body: file
    });
    if (!r.ok) throw new Error((await r.text()).slice(0, 150));
    return path;
  }

  function esc(s) {
    return (s == null ? '' : ('' + s))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function won(n) { return (Number(n) || 0).toLocaleString('ko-KR'); }
  /* ── 리뷰 주문이면 말을 바꿉니다 ──
     같은 화면을 쓰되 「글」을 「리뷰」로, 「학원」을 「업체」로 부릅니다.
     리뷰는 글마다 주소도 검색순위도 없습니다. */
  var RV = false;
  function W(blogWord, reviewWord) { return RV ? reviewWord : blogWord; }

  /* 언제 남긴 글인지 — 날짜와 시각까지 */
  function fdt(s) {
    if (!s) return '-';
    var d = new Date(s);
    return fdate(s) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function fdate(s) {
    if (!s) return '-';
    var d = new Date(s);
    return d.getFullYear() + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + ('0' + d.getDate()).slice(-2);
  }
  function dday(d) {
    if (!d) return null;
    var t = new Date().toISOString().slice(0, 10);
    return Math.round((new Date(d + 'T00:00:00') - new Date(t + 'T00:00:00')) / 86400000);
  }
  /* 열어도 되는 주소만 링크로 겁니다 */
  function safeUrl(u) {
    if (!u) return '';
    return /^https?:\/\//i.test(u) ? u : '';
  }
  var PG = document.getElementById('pg');
  function fail(msg, detail) {
    PG.innerHTML = '<div class="big" style="margin-top:48px;text-align:center">'
      + '<h1 style="font-size:19px;margin-bottom:8px">' + esc(msg) + '</h1>'
      + '<p style="color:var(--muted);font-size:13.5px">'
      + '주소가 중간에 잘리지 않았는지 확인해 주세요. '
      + '<b>?k=</b> 뒤에 글자가 붙어 있어야 합니다.<br>'
      + '그래도 안 열리면 담당자에게 말씀해 주세요.<br>'
      + 'ESC 학원지원센터 · <a href="tel:01073181790">010-7318-1790</a></p>'
      + '<button class="btn" style="margin-top:14px" onclick="location.reload()">다시 시도</button>'
      + (detail ? '<p class="mono" style="margin-top:14px;font-size:11px;word-break:break-all">'
        + esc(detail) + '</p>' : '')
      + '</div>';
  }
  /* 어떤 이유로든 화면이 하얗게 비지 않도록 */
  window.addEventListener('error', function (e) {
    if (PG && PG.textContent.indexOf('불러오는 중') >= 0) {
      fail('화면을 여는 중 문제가 생겼습니다', e.message || '');
    }
  });

  function key() {
    var m = location.search.match(/[?&]k=([^&#]+)/);
    if (m) return decodeURIComponent(m[1]);
    var h = location.hash.match(/k=([^&]+)/);
    return h ? decodeURIComponent(h[1]) : '';
  }

  /* 검색 순위 표시 */
  /* ⚠️ 999 는 「50위 밖」이라는 뜻입니다 (core.js A.RANK_OUT 과 같은 규칙).
     status.html 은 바깥 파일을 안 쓰기로 했으므로 여기에 따로 적어 둡니다. */
  function rank(n) {
    if (n == null) return '<span class="rk low">확인 중</span>';
    if (n >= 999) return '<span class="rk low">50위 밖</span>';
    var c = n <= 5 ? 'top' : n <= 20 ? 'mid' : 'low';
    return '<span class="rk ' + c + '">' + n + '위</span>';
  }

  function render(d) {
    RV = (d.track === 'review');           /* 리뷰 주문이면 말을 바꿉니다 */
    if (RV) {
      document.title = '리뷰 진행현황 · ESC 학원지원센터';
      var hb = document.querySelector('.pgtop b');
      if (hb) hb.textContent = '리뷰 진행현황';
    }
    var orders = d.orders || [], posts = d.posts || [];
    var T = { qty: 0, made: 0, writing: 0, review: 0, published: 0, checked: 0 };
    orders.forEach(function (o) {
      T.qty += o.qty || 0; T.made += o.made || 0; T.writing += o.writing || 0;
      T.review += o.review || 0; T.published += o.published || 0; T.checked += o.checked || 0;
    });
    var pct = T.qty ? Math.round(T.published / T.qty * 100) : 0;
    var working = T.writing + T.review;
    var waiting = Math.max(0, T.qty - T.published - working);
    var unpaid = orders.filter(function (o) { return !o.paid; }).length;

    var h = '';

    h += '<div class="hero"><h1>' + esc(d.academy) + '</h1>'
      + '<p>' + W('지금까지 올라간 글과 네이버 검색 순위입니다.',
                          '지금까지 올라간 리뷰입니다.')
      + ' 새로 올라갈 때마다 이 화면이 바뀝니다.</p></div>';

    h += '<div class="big">'
      + '<div class="n"><b>' + T.published + '</b><em>/ ' + T.qty + '편 올라갔습니다</em>'
      + '<span class="chip ' + (pct >= 100 ? 'c-ok' : 'c-info') + '" style="margin-left:auto">'
      + pct + '%</span></div>'
      + '<div class="bar' + (pct >= 100 ? '' : ' mid') + '"><i style="width:' + Math.min(100, pct) + '%"></i></div>'
      + '<div class="legend">'
      + '<span><i style="background:var(--ok)"></i>올라간 ' + W('글','리뷰') + ' ' + T.published + '편</span>'
      + '<span><i style="background:var(--info)"></i>' + W('쓰는 중','올릴 차례') + ' ' + working + '편</span>'
      + '<span><i style="background:var(--line)"></i>준비 중 ' + waiting + '편</span>'
      + '</div></div>';

    if (unpaid) {
      h += '<div class="msg ok" style="margin-top:12px">입금이 확인되면 ' + W('글 작성이','리뷰가') + ' 시작됩니다. '
        + '입금 확인이 안 된 주문이 ' + unpaid + '건 있습니다.</div>';
    }

    /* 주문 */
    h += '<div class="sec">주문 <small>' + orders.length + '건</small></div>';
    h += orders.map(function (o) {
      var dd = dday(o.deadline);
      var st = o.status === 'done' ? '<span class="chip c-ok">다 끝냈습니다</span>'
        : o.status === 'paused' ? '<span class="chip c-wait">잠시 멈춤</span>'
          : o.status === 'ended' ? '<span class="chip c-off">종료</span>'
            : '<span class="chip c-info">진행 중</span>';
      var ddChip = dd == null ? ''
        : dd < 0 ? '<span class="chip c-bad">마감일 지남</span>'
          : dd === 0 ? '<span class="chip c-bad">오늘이 마감일</span>'
            : dd <= 7 ? '<span class="chip c-wait">' + dd + '일 남음</span>'
              : '<span class="chip c-off">' + dd + '일 남음</span>';
      return '<div class="ocard">'
        + '<div class="h"><b>' + fdate(o.ordered_at) + ' 주문 · ' + o.qty + '편</b>' + st + ddChip
        + (o.paid ? '<span class="chip c-ok" style="margin-left:auto">입금 확인됨</span>'
          : '<span class="chip c-wait" style="margin-left:auto">입금 기다리는 중</span>') + '</div>'
        + '<div class="kv">'
        + '<div><label>주문 편수</label><span>' + o.qty + '편</span></div>'
        + '<div><label>올라간 ' + W('글','리뷰') + '</label><span>' + o.published + '편</span></div>'
        + '<div><label>마감일</label><span>' + (o.deadline ? fdate(o.deadline) : '-') + '</span></div>'
        + '<div><label>금액</label><span>' + (o.amount ? won(o.amount) + '원' : '-') + '</span></div>'
        + '</div></div>';
    }).join('');

    /* 사진 보내기 */
    h += '<div class="sec">사진 보내기 <small>지금까지 ' + (d.photos || 0) + '장 받았습니다</small></div>'
      + '<div class="ocard">'
      + '<p style="font-size:13.5px;color:var(--ink-2);line-height:1.7;margin-bottom:12px">'
      + '<b>신청하실 때 못 보내셨어도 괜찮습니다. 언제든 여기서 올리시면 됩니다.</b><br>'
      + '사진이 많을수록 좋습니다. ' + W('글','리뷰') + '마다 다른 사진을 써야 하기 때문입니다 — '
      + '<b>30장 이상을 권합니다.</b><br>'
      /* ⚠️ 리뷰 갈래에도 「강의실·교재·시간표·수업 자료·학생」이 그대로 나가고 있었습니다 —
         식당·미용실 사장님이 보시는 화면이라 말이 안 맞습니다. */
      + (RV
        ? '간판·건물 바깥, 내부, 자리, 메뉴·상품, 안내문 등 '
          + '<b>손님 얼굴이 나오지 않는 사진</b>이면 무엇이든 좋습니다.'
        : '간판·건물 바깥, 강의실, 교재, 시간표, 안내문, 수업 자료 등 '
          + '<b>학생 얼굴이 나오지 않는 사진</b>이면 무엇이든 좋습니다.')
      + '</p>'
      + '<input type="file" id="upFiles" accept="image/*" multiple '
      + 'style="width:100%;font-size:13px;margin-bottom:10px">'
      + '<input class="inp" id="upNote" placeholder="같이 알려주실 내용이 있으면 적어주세요 (안 쓰셔도 됩니다)" '
      + 'style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;'
      + 'background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px">'
      + '<div class="row" style="margin-top:12px">'
      + '<button class="btn btn-p" id="upGo">사진 올리기</button>'
      + '<span class="mono" id="upMsg">한 번에 60장까지 · <b>크기는 알아서 줄여 올립니다</b></span></div>'
      + (d.photos ? '<div class="msg ok" style="margin:14px 0 0">'
        + '✓ <b>' + d.photos + '장</b>이 잘 도착했습니다. ' + W('글 쓰는','리뷰 올리는') + ' 분들에게 나눠서 전달됩니다. '
        + '<button class="btn btn-s" id="seeMyPics" style="margin-left:6px">🖼 보낸 사진 보기</button></div>'
        + '<div id="myPics" class="picgrid hide"></div>' : '')
      + '</div>';

    /* 전달사항 */
    var notes = d.notes || [];
    h += '<div class="sec">전달사항 <small>' + (notes.length ? notes.length + '건 · ' : '')
      + '더 알려주실 내용을 적어 주세요</small></div>'
      + '<div class="ocard">'
      + '<textarea id="noteBody" rows="4" placeholder="예) 이번 주에 새 강의실을 열었습니다. 사진도 곧 보내드릴게요.&#10;예) 원장 이름은 ○○○ 입니다. 글에 넣어 주세요."'
      + ' style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;'
      + 'background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;line-height:1.6;resize:vertical"></textarea>'
      + '<div class="row" style="margin-top:10px">'
      + '<button class="btn btn-p" id="noteGo">보내기</button>'
      + '<span class="mono" id="noteMsg">담당자에게 바로 알림이 갑니다</span></div>'
      + (notes.length ? '<div style="margin-top:16px">' + notes.map(function (n) {
        return '<div class="noteitem">'
          + '<div class="row" style="gap:8px;margin-bottom:5px">'
          + '<span class="mono">' + fdt(n.at) + '</span>'
          + (n.seen ? '<span class="chip c-ok">담당자 확인함</span>'
            : '<span class="chip c-wait">확인 전</span>') + '</div>'
          + '<div class="notebody">' + esc(n.body) + '</div></div>';
      }).join('') + '</div>' : '')
      + '</div>';

    /* 올라간 글 */
    h += '<div class="sec">올라간 ' + W('글','리뷰') + ' <small>' + posts.length + '편'
      + W(' · 새 창에서 열립니다','') + '</small></div>';
    if (!posts.length) {
      h += '<div class="tblbox">' + '<div class="empty">아직 올라간 ' + W('글','리뷰') + '이 없습니다. '
        + W('글','리뷰') + '이 올라가는 대로 여기에 하나씩 쌓입니다.</div></div>';
    } else {
      h += '<div class="tblbox tblscroll"><table><thead><tr>'
        + '<th style="width:36px">#</th><th>' + W('이 글이 노린 검색어','무엇에 대한 리뷰인지') + '</th>'
        + '<th style="width:90px">올린 날</th>'
        /* 리뷰는 글마다 주소도 검색순위도 없습니다 — 그 칸을 아예 안 그립니다 */
        + (RV ? '' : '<th style="width:80px">검색 순위</th><th style="width:150px"></th>')
        + '</tr></thead><tbody>'
        + posts.map(function (p, i) {
          var u = safeUrl(p.url);
          var kw = p.keyword || '';
          return '<tr><td class="mono">' + (i + 1) + '</td>'
            + '<td><b>' + esc(kw) + '</b></td>'
            + '<td class="mono">' + fdate(p.at) + '</td>'
            + (RV ? '' :
              '<td>' + rank(p.rank) + '</td>'
              + '<td style="white-space:nowrap">'
              + (u
                ? (/demo_blog\d/.test(u)      /* 시연용으로 넣어둔 주소는 눌러도 안 열립니다 */
                  ? '<span class="btn btn-s" style="opacity:.6;cursor:default">시연용 주소</span> '
                  : '<a class="btn btn-s" href="' + esc(u) + '" target="_blank" rel="noopener nofollow">글 보기 ↗</a> ')
                : '')
              + (kw ? '<a class="btn btn-s" target="_blank" rel="noopener nofollow" href="https://search.naver.com/search.naver?query='
                + encodeURIComponent(kw) + '">검색 ↗</a>' : '')
              + '</td>')
            + '</tr>';
        }).join('')
        + '</tbody></table></div>';
    }

    h += RV
      ? '<div class="note"><b>리뷰는 어디에서 보나요?</b><br>'
        + '네이버 지도에서 업체를 검색하시면 <b>방문자 리뷰</b>에 하나씩 쌓입니다. '
        + '리뷰는 글과 달리 개별 주소가 없어서 여기에 링크를 걸어 드리지 못합니다. '
        + '대신 저희가 올라온 것을 하나하나 눈으로 확인하고 표시해 드립니다.<br><br>'
        + '<b>리뷰는 누가 쓰나요?</b><br>'
        + '저희가 업체에서 주신 내용으로 리뷰를 만들고, 함께하는 분들이 각자의 계정으로 올립니다. '
        + '한꺼번에 올리지 않고 <b>날짜와 시간을 나눠서</b> 올립니다. '
        + '올라간 리뷰는 최소 12개월 동안 지우지 않습니다.</div>'
      : '<div class="note"><b>검색 순위는 어떻게 나온 건가요?</b><br>'
        + '왼쪽에 적힌 검색어를 네이버에 그대로 넣었을 때, 그 글이 블로그 영역에서 몇 번째로 나왔는지를 '
        + '저희가 직접 확인해 적은 숫자입니다. 옆의 <b>검색 ↗</b> 버튼을 누르시면 직접 확인해 보실 수 있습니다.<br>'
        + '검색 순위는 시간이 지나면서 오르내립니다. 글이 쌓일수록 학원 이름이 걸리는 검색어가 늘어납니다.<br>'
        + '<b>「50위 밖」</b>은 그 검색어로 한참 내려도 아직 글이 안 보인다는 뜻입니다. '
        + '올린 지 얼마 안 된 글은 자리를 잡는 데 시간이 걸립니다.<br><br>'
        + '<b>글은 누가 쓰나요?</b><br>'
        + '저희와 함께하는 블로거들이 각자의 블로그에 학원을 소개하는 글을 올립니다. '
        + '올라간 글은 최소 12개월 동안 지우지 않습니다.</div>';

    /* 사업자 정보 — 블로그·리뷰 홍보를 파는 주체는 인투마케팅입니다(전자상거래법 표시 의무).
       ⚠️ 이 페이지는 바깥 파일을 안 쓰기로 했으므로 값을 여기에 직접 적습니다.
       사업자 정보가 바뀌면 여기도 같이 고쳐야 합니다. */
    h += '<div class="pgfoot">ESC 학원지원센터 · 010-7318-1790 · benjamin.leeeunchong08@gmail.com<br>'
      + '이 주소는 ' + W('학원','업체') + '별로 다릅니다. 다른 곳의 내용은 보이지 않습니다.<br>'
      + '<span class="mono">' + fdate(d.now) + ' 기준</span>'
      + '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);opacity:.85">'
      + '인투마케팅 · 대표 양회광 · 사업자등록번호 306-24-53380<br>'
      + '대전광역시 유성구 은구비남로33번길 13-8, 3397호 (지족동, 양지빌딩)</div>'
      + '</div>';

    PG.innerHTML = h;
    wireUpload();
    wireNote();
    wireMyPics();
  }

  /* ── 보낸 사진 보기 ──
     사진은 아무나 못 보게 잠가 두었습니다. 이 주소의 비밀 코드를 확인한 뒤에만
     1시간짜리 임시 주소를 내주는 작은 서버 함수를 거칩니다. */
  /* 사진이 크고 많아서(한 장에 1~5MB) 한꺼번에 받으면 폰에서 멈춥니다. 12장씩 보여줍니다 */
  var PICS = [], SHOWN = 0;
  function morePics() {
    var box = document.getElementById('myPics'); if (!box) return;
    var old = document.getElementById('morePics');
    if (old) old.parentNode.removeChild(old);

    var next = PICS.slice(SHOWN, SHOWN + 12);
    box.insertAdjacentHTML('beforeend', next.map(function (u, i) {
      var n = SHOWN + i + 1;
      return '<a class="picitem" href="' + esc(u) + '" target="_blank" rel="noopener">'
        + '<img src="' + esc(u) + '" loading="lazy" alt="사진 ' + n + '">'
        + '<span>' + n + '</span></a>';
    }).join(''));
    SHOWN += next.length;

    if (!PICS.length) { box.innerHTML = '<div class="mono">사진이 없습니다.</div>'; return; }
    if (SHOWN < PICS.length) {
      box.insertAdjacentHTML('afterend',
        '<div id="morePics" style="margin-top:12px;text-align:center">'
        + '<button class="btn" id="morePicsBtn">더 보기 (남은 ' + (PICS.length - SHOWN) + '장)</button></div>');
      document.getElementById('morePicsBtn').onclick = morePics;
    }
  }

  function wireMyPics() {
    var btn = document.getElementById('seeMyPics'); if (!btn) return;
    btn.onclick = async function () {
      var box = document.getElementById('myPics');
      if (!box.classList.contains('hide')) {
        box.classList.add('hide');
        var mp = document.getElementById('morePics'); if (mp) mp.parentNode.removeChild(mp);
        btn.textContent = '🖼 보낸 사진 보기'; return;
      }
      btn.disabled = true; btn.textContent = '불러오는 중…';
      try {
        var r = await fetch(SB_URL + '/functions/v1/academy-photos', {
          method: 'POST', headers: hdr({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ k: key() })
        });
        var j = await r.json();
        if (!r.ok) throw new Error(j.error || '오류');
        PICS = j.urls || [];
        SHOWN = 0;
        box.innerHTML = '';
        box.classList.remove('hide');
        morePics();
        btn.textContent = '사진 접기';
      } catch (e) {
        btn.textContent = '🖼 보낸 사진 보기';
        alert('사진을 불러오지 못했습니다. 잠시 뒤 다시 눌러 주세요.');
      }
      btn.disabled = false;
    };
  }

  /* ── 전달사항 남기기 ── */
  function wireNote() {
    var btn = document.getElementById('noteGo'); if (!btn) return;
    btn.onclick = async function () {
      var ta = document.getElementById('noteBody');
      var msg = document.getElementById('noteMsg');
      var body = (ta.value || '').trim();
      if (!body) { msg.textContent = '내용을 적어 주세요.'; ta.focus(); return; }
      btn.disabled = true; ta.disabled = true; msg.textContent = '보내는 중…';
      try {
        await rpc('order_add_note', { k: key(), p_body: body });
        ta.value = '';
        msg.textContent = '보냈습니다. 담당자가 확인하면 아래에 표시됩니다.';
        await load();
      } catch (e) {
        msg.textContent = '보내지 못했습니다: ' + (e && e.message || '');
        btn.disabled = false; ta.disabled = false;
      }
    };
  }

  /* ── 사진 올리기 ──
     요즘 폰 사진은 한 장에 4000×3000 · 5MB씩 합니다. 블로그 글에는 그만한 크기가
     필요 없어서 보내기 전에 브라우저에서 줄입니다. 원장님 데이터도 아끼고,
     나중에 글 쓰는 분들이 받을 때도 빨라집니다. */
  var LONG_SIDE = 1600, QUALITY = 0.82;
  async function shrinkPhoto(file) {
    if (!/^image\//.test(file.type) || /gif|svg/.test(file.type)) return file;
    var bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) {
      try { bmp = await createImageBitmap(file); } catch (e2) { return file; }  /* 못 줄이면 원본 */
    }
    var w = bmp.width, h = bmp.height, long = Math.max(w, h);
    if (long <= LONG_SIDE && file.size <= 700 * 1024) { bmp.close && bmp.close(); return file; }
    var s = Math.min(1, LONG_SIDE / long);
    var cw = Math.round(w * s), ch = Math.round(h * s);
    var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    var cx = cv.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, cw, ch);
    cx.drawImage(bmp, 0, 0, cw, ch);
    bmp.close && bmp.close();
    var blob = await new Promise(function (r) { cv.toBlob(r, 'image/jpeg', QUALITY); });
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name, { type: 'image/jpeg' });
  }

  function wireUpload() {
    var btn = document.getElementById('upGo'); if (!btn) return;
    btn.onclick = async function () {
      var inp = document.getElementById('upFiles');
      var msg = document.getElementById('upMsg');
      var files = inp.files ? Array.prototype.slice.call(inp.files) : [];
      if (!files.length) { msg.textContent = '올릴 사진을 먼저 골라 주세요.'; return; }
      if (files.length > 60) { msg.textContent = '한 번에 60장까지만 올릴 수 있습니다.'; return; }

      btn.disabled = true; inp.disabled = true;
      var folder = 'k-' + key();
      var stamp = String(Date.now());
      var paths = [], saved = 0;
      try {
        for (var i = 0; i < files.length; i++) {
          msg.textContent = files.length + '장 중 ' + (i + 1) + '장째 — 크기 줄이는 중…';
          var f = await shrinkPhoto(files[i]);
          saved += Math.max(0, files[i].size - f.size);
          if (f.size > 10 * 1024 * 1024) {
            throw new Error('「' + files[i].name + '」은 줄여도 10MB가 넘습니다');
          }
          /* 안 줄여지고 원본 그대로 갈 수도 있어서 실제 형식에 맞춰 확장자를 붙입니다 */
          var ext = (f.type === 'image/jpeg') ? 'jpg'
            : (f.type.split('/')[1] || 'jpg').replace(/[^a-z0-9]/g, '') || 'jpg';
          var path = folder + '/' + stamp + '-' + ('00' + (i + 1)).slice(-3) + '.' + ext;
          msg.textContent = files.length + '장 중 ' + (i + 1) + '장째 올리는 중…';
          paths.push(await putPhoto(path, f));
        }
        var note = (document.getElementById('upNote').value || '').trim();
        await rpc('order_add_photos', { k: key(), p_paths: paths, p_note: note || null });
        msg.textContent = '';
        alert(paths.length + '장을 보내주셨습니다. 담당자가 확인하고 글에 씁니다. 감사합니다!'
          + (saved > 1048576
            ? '\n\n(보내기 좋게 크기를 줄여 ' + Math.round(saved / 1048576) + 'MB를 아꼈습니다)' : ''));
        load();
      } catch (e) {
        msg.textContent = '올리지 못했습니다: ' + e.message + ' — 다시 시도해 주시거나 010-7318-1790 으로 연락 주세요.';
        btn.disabled = false; inp.disabled = false;
      }
    };
  }

  async function load() {
    var k = key();
    if (!k) { fail('주소에 확인 코드가 없습니다'); return; }
    try {
      var data = await rpc('order_status', { k: k });
      if (!data) { fail('이 주소로는 볼 수 있는 내용이 없습니다'); return; }
      render(data);
    } catch (e) {
      fail('불러오지 못했습니다', e && e.message);
    }
  }

  document.getElementById('btnRe').onclick = function () { PG.innerHTML = '<div class="empty" style="margin-top:60px">불러오는 중입니다…</div>'; load(); };
  load();
})();
</script>
